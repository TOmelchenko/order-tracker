name: order-tracker

services:
  app:
    image: order-tracker:${ORDER_TRACKER_TAG:-local}
    build: .
    ports:
      - "127.0.0.1:${ORDER_TRACKER_PORT:-8000}:8000"
    environment:
      ORDER_DB_PATH: /data/orders.db
      OTEL_FILE_LOG_PATH: /telemetry/otel.log
    volumes:
      - orders:/data
      - ./incident-response/telemetry:/telemetry
      - ./app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

  incident-responder:
    build: ./incident-response
    ports:
      - "127.0.0.1:${INCIDENT_RESPONDER_PORT:-8001}:8001"
    environment:
      OTEL_FILE_LOG_PATH: /telemetry/otel.log
      DASHBOARD_URL: http://localhost:${GRAFANA_PORT:-3000}/d/order-tracker-requests/order-tracker
    volumes:
      - ./incident-response/telemetry:/telemetry:ro
      - ./incident-response/incidents:/incidents
      - ./incident-response/claude-config:/home/responder/.claude
      - ./incident-response/claude-home.json:/home/responder/.claude.json
      - ./app:/workspace/app
    restart: unless-stopped
    depends_on:
      - app

volumes:
  orders:
  prometheus:
  grafana:

networks:
  default:
    ipam:
      config:
        - subnet: ${ORDER_TRACKER_SUBNET:-10.215.24.0/24}
